function pcsv(t){const l=t.trim().split('\n').filter(Boolean);if(l.length<2)return[];const h=l[0].split(';').map(x=>x.trim());return l.slice(1).map(s=>{const v=s.split(';').map(x=>x.trim());const o={};h.forEach((k,i)=>o[k]=v[i]||'');if(o['실수 기술']==='ETC'||o['실수 기술']==='etc')o['실수 기술']='판단미스';return o;});}
const W=r=>r&&r.toLowerCase().includes('win');
const L=r=>r&&r.toLowerCase().includes('lose');
const fmt=ms=>{const s=Math.round(ms/1000);return s<60?s+'초':Math.floor(s/60)+'분'+(s%60)+'초';};
function ckclk(rows){
  const s=[...rows].sort((a,b)=>+a['위치']-+b['위치']);
  let h=0,a=0;const sk=new Set();
  s.forEach((r,i)=>{if(W(r.Result))h++;else if(L(r.Result))a++;if(h>=21||a>=21){if(i+1<s.length)sk.add(i+1);h=0;a=0;}});
  return s.map((r,i)=>{
    if(i===0||sk.has(i)||s[i]['이름']!==s[i-1]['이름'])return{...r,c:null};
    const pe=+s[i-1]['위치']+ +s[i-1]['기간'];const g=(+r['위치']-pe)/1000;
    return{...r,c:(g>0&&g<60)?parseFloat(g.toFixed(1)):null};
  });
}

const R2=['#7f1d1d','#991b1b','#b91c1c','#dc2626','#ef4444','#f87171'];

// 좌우 코트 SVG - 왼쪽: 성공존(어웨이) / 오른쪽: 실점존(홈)
// 두 코트 모두 위=NET, 아래=베이스라인, 존 배치 동일
function FULL_COURT(loseZ, winZ) {
  const ROWS = [[2,7,1],[6,8,5],[4,9,3]]; // 위(네트)→아래(베이스)
  const W=370, H=320;
  const gap=8;        // 두 코트 사이 간격
  const labelH=24;   // 코트 라벨 높이
  const netH=18;     // NET 표시 공간
  const bottomH=16;  // 베이스라인 라벨 공간
  const cW=(W-gap)/2;
  const cH=H-labelH-netH-bottomH;   // 실제 코트 셀 높이
  const cellW=cW/3, cellH=cH/3;
  const lx=0, rx=cW+gap;
  const courtY=labelH+netH;         // 코트 시작 Y (라벨+네트공간 아래)

  function winCol(r){
    if(!r)return{bg:'#e2e8f0',tx:'#64748b'};
    if(r<.25)return{bg:'#bfdbfe',tx:'#1e3a8a'};
    if(r<.5) return{bg:'#3b82f6',tx:'#fff'};
    if(r<.75)return{bg:'#1d4ed8',tx:'#fff'};
    return          {bg:'#1e3a8a',tx:'#fff'};
  }
  function loseCol(r){
    if(!r)return{bg:'#e2e8f0',tx:'#64748b'};
    if(r<.25)return{bg:'#fef08a',tx:'#92400e'};
    if(r<.5) return{bg:'#fb923c',tx:'#fff'};
    if(r<.75)return{bg:'#dc2626',tx:'#fff'};
    return          {bg:'#7f1d1d',tx:'#fff'};
  }

  function cells(zMap, colFn, ox) {
    const total=Object.values(zMap).reduce((a,b)=>a+b,0);
    const mx=Math.max(...Object.values(zMap),1);
    let h='';
    ROWS.forEach((row,ri)=>{
      row.forEach((zn,ci)=>{
        const cnt=zMap[zn]||0, pct=total>0?Math.round(cnt/total*100):0;
        const{bg,tx}=colFn(cnt/mx);
        const x=ox+ci*cellW, y=courtY+ri*cellH;
        const cx=x+cellW/2, cy=y+cellH/2;
        h+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cellW.toFixed(1)}" height="${cellH.toFixed(1)}" fill="${bg}"/>`;
        const nFill=(['#e2e8f0'].includes(bg))?'#94a3b8':(bg==='#fef08a'||bg==='#bfdbfe')?'rgba(0,0,0,0.5)':'rgba(255,255,255,0.7)';
        if(pct>0){
          // 구역 번호: 셀 상단 중앙
          h+=`<text x="${cx.toFixed(1)}" y="${(y+13).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="900" fill="${nFill}" font-family="inherit">${zn}</text>`;
          // 퍼센트: 셀 중앙
          h+=`<text x="${cx.toFixed(1)}" y="${(cy+5).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="900" fill="${tx}" font-family="inherit">${pct}%</text>`;
          // 횟수: 셀 하단
          h+=`<text x="${cx.toFixed(1)}" y="${(y+cellH-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${tx}" font-family="inherit">${cnt}회</text>`;
        }else{
          // 빈 셀: 번호만 중앙
          h+=`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="900" fill="${nFill}" font-family="inherit">${zn}</text>`;
        }
      });
    });
    return h;
  }

  function lines(ox){
    const x1=ox, x2=ox+cW, y1=courtY, y2=courtY+cH;
    return [
      `<rect x="${x1}" y="${y1}" width="${cW.toFixed(1)}" height="${cH.toFixed(1)}" fill="none" stroke="#1e293b" stroke-width="2" rx="2"/>`,
      `<line x1="${(ox+cellW).toFixed(1)}" y1="${y1}" x2="${(ox+cellW).toFixed(1)}" y2="${y2}" stroke="#475569" stroke-width="1.2"/>`,
      `<line x1="${(ox+cellW*2).toFixed(1)}" y1="${y1}" x2="${(ox+cellW*2).toFixed(1)}" y2="${y2}" stroke="#475569" stroke-width="1.2"/>`,
      `<line x1="${x1}" y1="${(y1+cellH).toFixed(1)}" x2="${x2}" y2="${(y1+cellH).toFixed(1)}" stroke="#64748b" stroke-width="0.8" stroke-dasharray="5,3"/>`,
      `<line x1="${x1}" y1="${(y1+cellH*2).toFixed(1)}" x2="${x2}" y2="${(y1+cellH*2).toFixed(1)}" stroke="#64748b" stroke-width="0.8" stroke-dasharray="5,3"/>`,
      // 네트: 코트 상단에 굵은 선 + 양쪽 기둥
      `<line x1="${(x1-4)}" y1="${y1}" x2="${(x2+4)}" y2="${y1}" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>`,
      `<line x1="${x1}" y1="${(y1-4)}" x2="${x1}" y2="${(y1+4)}" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>`,
      `<line x1="${x2}" y1="${(y1-4)}" x2="${x2}" y2="${(y1+4)}" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>`,
      // NET 텍스트: 네트선 위에 여백 확보
      `<text x="${(ox+cW/2).toFixed(1)}" y="${(courtY-5)}" text-anchor="middle" font-size="9" font-weight="900" fill="#1e293b" font-family="inherit" letter-spacing="1">— NET —</text>`,
    ].join('');
  }

  // 코트 라벨 (라벨H 공간에)
  const awLbl=`<rect x="${lx}" y="1" width="${cW.toFixed(1)}" height="21" rx="4" fill="#dbeafe"/>
    <text x="${(lx+cW/2).toFixed(1)}" y="14" text-anchor="middle" font-size="11" font-weight="900" fill="#1d4ed8" font-family="inherit">득점 존 (상대 코트)</text>`;
  const hmLbl=`<rect x="${rx.toFixed(1)}" y="1" width="${cW.toFixed(1)}" height="21" rx="4" fill="#fee2e2"/>
    <text x="${(rx+cW/2).toFixed(1)}" y="14" text-anchor="middle" font-size="11" font-weight="900" fill="#b91c1c" font-family="inherit">실점 존 (본인 코트)</text>`;

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">
    ${awLbl}${hmLbl}
    ${cells(winZ,winCol,lx)}${cells(loseZ,loseCol,rx)}
    ${lines(lx)}${lines(rx)}
  </svg>`;
}



let AD=[],CF='all',curTab=1;
function LC(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{AD=ckclk(pcsv(e.target.result));BS();R();};r.readAsText(f,'utf-8');}
function BS(){
  const sets=[...new Set(AD.map(r=>r['이름']).filter(Boolean))].sort();
  const w=document.getElementById('sb');w.innerHTML='';
  ['all',...sets].forEach(s=>{const b=document.createElement('button');b.className='epb'+(s===CF?' on':'');b.textContent=s==='all'?'전체':s;b.onclick=()=>{CF=s;BS();R();};w.appendChild(b);});
}
const GD=()=>CF==='all'?AD:AD.filter(r=>r['이름']===CF);

function SW(n){
  curTab=n;
  [1,2,3].forEach(i=>{
    const t=document.getElementById('t'+i), c=document.getElementById('card'+i);
    if(t) t.className='tab'+(i===n?' on':'');
    if(c) c.style.display=i===n?'flex':'none';
  });
  const hints={1:'📸 코트+실수 화면 스크린샷',2:'📸 25초 클락 스크린샷',3:'📸 25초 클락 이어서 스크린샷'};
  document.getElementById('hint').textContent=hints[n]||'';
}

function R(){
  const pn=document.getElementById('ip').value,op=document.getElementById('io').value,dt=document.getElementById('id').value;

  // 카드1,2,3 공통 헤더 업데이트
  ['dp','dp2','dp3'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=pn;});
  ['di','di2','di3'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='vs '+op+' · '+dt;});

  const data=GD(),wr=data.filter(r=>r.Result);
  const wins=wr.filter(r=>W(r.Result)).length,loses=wr.filter(r=>L(r.Result)).length;
  const rate=wr.length?Math.round(wins/wr.length*100):0;
  const avg=data.length?data.reduce((s,r)=>s+parseFloat(r['기간']||0),0)/data.length:0;

  const sets=[...new Set(AD.map(r=>r['이름']).filter(Boolean))].sort();
  const ss=sets.map(s=>{const rows=AD.filter(r=>r['이름']===s);return{s,w:rows.filter(r=>W(r.Result)).length,l:rows.filter(r=>L(r.Result)).length};});
  const badgeHTML=ss.map(x=>{const win=x.w>x.l;return`<div class="bg" style="background:${win?'#eff6ff':'#fef2f2'};border:1px solid ${win?'#bfdbfe':'#fecaca'};color:${win?'#1d4ed8':'#b91c1c'}">${x.s} ${x.w}-${x.l}</div>`;}).join('');
  ['ds','ds2','ds3'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=badgeHTML;});

  const kpiHTML=[{l:'득점',v:wins,c:'#1d4ed8',bg:'#eff6ff'},{l:'실점',v:loses,c:'#b91c1c',bg:'#fef2f2'},{l:'득점률',v:rate+'%',c:'#1e3a5f',bg:'#eff6ff'},{l:'평균랠리',v:fmt(avg),c:'#334155',bg:'#f8fafc'}].map(k=>`<div class="kc" style="background:${k.bg}"><div class="kl" style="color:${k.c}">${k.l}</div><div class="kv" style="color:${k.c}">${k.v}</div></div>`).join('');
  ['dk','dk2','dk3'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=kpiHTML;});

  const wz={},lz={};
  data.forEach(r=>{const z=pz(r['Zone']);if(!z)return;if(W(r.Result))wz[z]=(wz[z]||0)+1;if(L(r.Result))lz[z]=(lz[z]||0)+1;});
  const tm={};data.filter(r=>r['실수 기술']).forEach(r=>{const t=r['실수 기술'];tm[t]=(tm[t]||0)+1;});
  const te=Object.entries(tm).sort((a,b)=>b[1]-a[1]),tt=te.reduce((s,[,v])=>s+v,0),tmx=te[0]?.[1]||1;
  const rm={};wr.forEach(r=>{rm[r.Result]=(rm[r.Result]||0)+1;});
  const re=Object.entries(rm).sort((a,b)=>b[1]-a[1]),rmx=re[0]?.[1]||1;
  let sh=0,sa=0,ps='';
  const ckR=data.map(r=>{const cs=r['이름']||'';if(ps&&cs!==ps){sh=0;sa=0;}ps=cs;if(W(r.Result))sh++;else if(L(r.Result))sa++;return{...r,sh,sa};}).filter(r=>r.c!==null&&r.c>0);
  const ca=ckR.length?ckR.reduce((s,r)=>s+r.c,0)/ckR.length:0,co=ckR.filter(r=>r.c>25).length;

  // ── 카드1: 코트맵 + 실수기술 + 결과 ───────────────────────────
  let h1=`
  ${FULL_COURT(lz,wz)}
  <div class="g2">
    <div class="s" style="background:#fef2f2;border:1px solid #fecaca;padding:7px 9px">
      <div class="stl" style="color:#b91c1c">실수 기술 · ${tt}회</div>
      ${te.map(([t,c],i)=>{
        const pct=Math.round(c/tt*100),col=R2[Math.min(i,R2.length-1)];
        return `<div class="br"><div class="bh"><span class="bn">${t}</span><div class="bm"><span class="bp">${pct}%</span><span class="bc" style="color:${col}">${c}</span></div></div><div class="bt"><div class="bf" style="width:${c/tmx*100}%;background:${col}"></div></div></div>`;
      }).join('')}
    </div>
    <div class="s" style="background:#f8fafc;border:1px solid #e2e8f0;padding:7px 9px">
      <div class="stl" style="color:#334155">경기 결과</div>
      ${re.map(([k,v])=>{
        const m=RM[k];
        return `<div class="rr"><div class="rd" style="background:${m?.c}"></div><span class="rl">${m?.l||k}</span><span class="rc" style="color:${m?.c}">${v}</span><div class="rt"><div class="rf" style="width:${v/rmx*100}%;background:${m?.c}"></div></div></div>`;
      }).join('')}
    </div>
  </div>`;
  document.getElementById('db1').innerHTML=h1;

  // ── 카드2/3: 25초 클락 분할 ────────────────────────────────────
  // 타일 공통 HTML 생성 함수
  function tileHTML(rows) {
    return rows.map(r=>{
      const v=r.c,sn=r['이름']||'',sc=SC[sn]||'#64748b';
      return `<div style="width:28px;border-radius:4px;overflow:hidden;background:${CB(v)};border:1.5px solid ${CD(v)}">
        <div style="height:3px;background:${sc}"></div>
        <div style="padding:2px 1px 3px;text-align:center">
          <div style="font-size:10px;font-weight:900;color:${CC(v)};line-height:1">${v.toFixed(0)}s</div>
          <div style="font-size:6px;font-weight:800;color:#334155;margin-top:1px;background:rgba(255,255,255,0.9);border-radius:2px;padding:0 1px">${r.sh}-${r.sa}</div>
          <div style="font-size:5px;font-weight:800;color:${sc};margin-top:1px">${sn}</div>
        </div>
      </div>`;
    }).join('');
  }

  const legendHTML=`<div style="display:flex;gap:10px;margin-top:9px;flex-wrap:wrap;font-size:9px">
    ${[['#15803d','#dcfce7','~15초'],['#b45309','#fef9c3','15~22초'],['#b91c1c','#fee2e2','22초+']].map(([c,bg,l])=>`
      <span style="display:flex;align-items:center;gap:4px">
        <span style="width:10px;height:10px;background:${bg};border:2px solid ${c};border-radius:2px;display:inline-block"></span>
        <span style="color:#475569;font-weight:700">${l}</span>
      </span>`).join('')}
    ${Object.entries(SC).map(([s,c])=>`
      <span style="display:flex;align-items:center;gap:4px">
        <span style="width:10px;height:4px;background:${c};border-radius:2px;display:inline-block"></span>
        <span style="color:#475569;font-weight:700">${s}</span>
      </span>`).join('')}
  </div>`;

  // 타일 전체 카드2에 표시
  document.getElementById('t3').style.display = 'none';

  function summaryBoxHTML() {
    return `<div style="display:flex;gap:5px;margin-bottom:9px">
      ${[{l:'평균',v:ca>0?ca.toFixed(1)+'초':'-',c:CC(ca),bg:CB(ca)},
         {l:'25초 초과',v:co+'회',c:co>0?'#b91c1c':'#15803d',bg:co>0?'#fee2e2':'#dcfce7'},
         {l:'평균 랠리',v:fmt(avg),c:'#334155',bg:'#f1f5f9'}
      ].map(k=>`<div style="flex:1;background:${k.bg};border:1px solid ${k.c}30;border-radius:9px;padding:8px 6px;text-align:center">
        <div style="font-size:9px;color:#64748b;font-weight:800;margin-bottom:3px">${k.l}</div>
        <div style="font-size:19px;font-weight:900;color:${k.c};line-height:1">${k.v}</div>
      </div>`).join('')}
    </div>`;
  }

  // 카드2: 전체 타일 한 장에
  let h2=`<div class="s" style="background:#f8fafc;border:1px solid #e2e8f0;overflow:visible">
    <div class="stl" style="color:#334155">⏲ 25초 클락</div>
    ${summaryBoxHTML()}
    <div style="font-size:10px;color:#475569;font-weight:800;margin-bottom:6px">랠리별 · 세트 · 점수</div>
    <div style="display:flex;flex-wrap:wrap;gap:2px">${tileHTML(ckR)}</div>
    ${legendHTML}
  </div>`;
  document.getElementById('db2').innerHTML=h2;
}
AD=ckclk(pcsv(CSV));BS();R();
</script>
</body>
</html>
