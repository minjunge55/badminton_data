<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#fff}
  .card{width:390px;min-height:844px;background:#fff;display:flex;flex-direction:column;overflow:visible}
  .hdr{background:#eff6ff;padding:10px 14px 8px;border-bottom:1px solid #bfdbfe}
  .sub{font-size:7px;color:#94a3b8;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
  .name{font-size:26px;font-weight:900;color:#1e3a5f;line-height:1.1}
  .info{font-size:11px;color:#64748b;margin-top:3px}
  .badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .bg{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
  .bg-w{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
  .bg-l{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .kpi{display:flex;gap:6px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
  .kc{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px 4px;text-align:center}
  .kl{font-size:8px;color:#64748b;font-weight:800;margin-bottom:2px}
  .kv{font-size:18px;font-weight:900;line-height:1}
  .body{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
  .s{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px}
  .stl{font-size:11px;font-weight:900;color:#475569;letter-spacing:.5px;margin-bottom:12px}
  .bot{height:8px;background:linear-gradient(90deg,#1d4ed8,#7c3aed);flex-shrink:0}

  /* 실수 위치 - 카드형 시각화 */
  .miss-grid{display:flex;flex-direction:column;gap:8px}
  .miss-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #fecaca;border-radius:10px;padding:9px 11px}
  .miss-rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
  .miss-tech{font-size:14px;font-weight:900;color:#1e293b;flex-shrink:0}
  .miss-dir{font-size:10px;font-weight:800;padding:2px 8px;border-radius:12px;flex-shrink:0}
  .miss-bar-wrap{flex:1;display:flex;align-items:center;gap:6px}
  .miss-bar{flex:1;height:18px;background:#fef2f2;border-radius:5px;overflow:hidden}
  .miss-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#ef4444,#b91c1c)}
  .miss-pct{font-size:15px;font-weight:900;color:#b91c1c;flex-shrink:0;width:42px;text-align:right}

  /* 실점 위치 분석 */
  .loc-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .loc-label{flex-shrink:0;width:155px}
  .loc-name{font-size:12px;font-weight:900;color:#1e293b}
  .loc-desc{font-size:9px;color:#64748b;margin-top:1px}
  .loc-bar{flex:1;height:16px;background:#fff7ed;border-radius:5px;overflow:hidden;border:1px solid #fed7aa}
  .loc-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#fb923c,#ea580c)}
  .loc-pct{font-size:14px;font-weight:900;color:#ea580c;flex-shrink:0;width:42px;text-align:right}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hdr">
    <div class="sub">🎯 상대 분석</div>
    <div class="name" id="ip1">이다희</div>
    <div class="info"><span id="id">WS · 단식</span></div>
    <div class="badges" id="ds"></div>
  </div>
  <div class="kpi" id="dk"></div>
  <div class="body" id="db"></div>
  <div class="bot"></div>
</div>

<script>
const CSV=`이름,위치,기간,Result,Technics,Direction,뒷사각,패턴코트위치
PLACEHOLDER`;

const W=r=>r.Result?.toLowerCase().includes('win');
const L=r=>r.Result?.toLowerCase().includes('lose');

const TM={'Smash':'스매시','Clear':'클리어','Drop':'드롭','Hairpin':'헤어핀','Drive':'드라이브','Cut':'커트','Push':'푸시','Return':'리턴','ETC':'판단미스','숏서브 리시브':'숏서브리시브','롱서브 리시브':'롱서브리시브','숏서브':'숏서브','S.Drive':'숏드라이브','Block':'블록','cross':'크로스'};
const DM={'Left':'왼쪽','Right':'오른쪽','Middle':'가운데'};
const DCOLOR={'왼쪽':{bg:'#ede9fe',tx:'#6d28d9'},'오른쪽':{bg:'#cffafe',tx:'#0e7490'},'가운데':{bg:'#f1f5f9',tx:'#475569'}};
// 존 이름 + 설명 매핑
const ZONE_DESC={
  '앞사이드':'앞 리턴 후 수비',
  '뒷사이드':'클리어 후 수비',
  '뒤사이드':'클리어 후 수비',
};

function pcsv(t){
  const lines=t.trim().split('\n').filter(Boolean);
  const delim=lines[0].includes(';')?';':',';
  const h=lines[0].split(delim).map(x=>x.trim().replace(/^\uFEFF/,'').replace(/\r/g,''));
  return lines.slice(1).map(s=>{
    const v=s.split(delim).map(x=>x.trim().replace(/\r/g,''));
    const o={};h.forEach((k,i)=>o[k]=v[i]||'');
    const m=o['이름']?.match(/(\d+set)/);if(m)o['이름']=m[1];
    if(o.Result==='Away Mistake Win')o.Result='Away Mistakes Win';
    return o;
  });
}

function render(){
  const data=pcsv(CSV);
  const wins=data.filter(W), loses=data.filter(L);
  const sets=[...new Set(data.map(r=>r['이름']).filter(Boolean))].sort();

  document.getElementById('ds').innerHTML=sets.map(s=>{
    const sr=data.filter(r=>r['이름']===s);
    const sw=sr.filter(W).length,sl=sr.filter(L).length;
    return`<div class="bg ${sw>sl?'bg-w':'bg-l'}">${s} ${sw}-${sl}</div>`;
  }).join('');

  const total=wins.length+loses.length;
  document.getElementById('dk').innerHTML=[
    {l:'득점',v:wins.length,c:'#1d4ed8'},
    {l:'실점',v:loses.length,c:'#b91c1c'},
    {l:'득점률',v:total?Math.round(wins.length/total*100)+'%':'-',c:'#334155'},
    {l:'본인 실수',v:data.filter(r=>r.Result==='Mistake Lose').length,c:'#ea580c'},
  ].map(k=>`<div class="kc"><div class="kl">${k.l}</div><div class="kv" style="color:${k.c}">${k.v}</div></div>`).join('');

  // ── 실수 위치 (기술+방향) ────────────────────────────────────
  const ml=data.filter(r=>r.Result==='Mistake Lose');
  const combo={};
  ml.forEach(r=>{
    const t=(TM[r.Technics]||r.Technics||'').trim();
    const d=(DM[r.Direction]||r.Direction||'').trim();
    if(t){const key=t+'|'+d;combo[key]=(combo[key]||0)+1;}
  });
  const comboSorted=Object.entries(combo).sort((a,b)=>b[1]-a[1]);
  const mlTotal=ml.length||1;
  const comboMax=comboSorted.length?comboSorted[0][1]:1;
  const rankColors=['#b91c1c','#dc2626','#ef4444','#f87171'];
  const missHTML=comboSorted.map(([k,c],i)=>{
    const [t,d]=k.split('|');
    const pct=Math.round(c/mlTotal*100);
    const dc=DCOLOR[d]||{bg:'#f1f5f9',tx:'#475569'};
    const rc=i<3?rankColors[i]:'#94a3b8';
    return`<div class="miss-row">
      <div class="miss-rank" style="background:${rc}">${i+1}</div>
      <div class="miss-tech">${t}</div>
      <div class="miss-dir" style="background:${dc.bg};color:${dc.tx}">${d||'-'}</div>
      <div class="miss-bar-wrap">
        <div class="miss-bar"><div class="miss-fill" style="width:${Math.round(c/comboMax*100)}%"></div></div>
        <div class="miss-pct">${pct}%</div>
      </div>
    </div>`;
  }).join('');

  // ── 실점 위치 분석 (뒷사각) ──────────────────────────────────
  const zoneCount={};
  data.forEach(r=>{const z=r['뒷사각']?.trim();if(z)zoneCount[z]=(zoneCount[z]||0)+1;});
  const zoneTotal=Object.values(zoneCount).reduce((a,b)=>a+b,0)||1;
  const zoneSorted=Object.entries(zoneCount).sort((a,b)=>b[1]-a[1]);
  const zoneMax=zoneSorted.length?zoneSorted[0][1]:1;
  const locHTML=zoneSorted.map(([z,c])=>{
    const pct=Math.round(c/zoneTotal*100);
    const desc=ZONE_DESC[z]||'';
    return`<div class="loc-row">
      <div class="loc-label">
        <div class="loc-name">${z}</div>
        ${desc?`<div class="loc-desc">${desc}</div>`:''}
      </div>
      <div class="loc-bar"><div class="loc-fill" style="width:${Math.round(c/zoneMax*100)}%"></div></div>
      <div class="loc-pct">${pct}%</div>
    </div>`;
  }).join('');

  document.getElementById('db').innerHTML=`
    <div class="s">
      <div class="stl">⚠️ 실수 위치 (기술 · 방향)</div>
      <div class="miss-grid">${missHTML||'<div style="font-size:11px;color:#94a3b8">데이터 없음</div>'}</div>
      <div style="font-size:9px;color:#94a3b8;margin-top:8px">본인 실수 ${ml.length}회 · 전체 대비 %</div>
    </div>
    <div class="s">
      <div class="stl">📍 실점 위치 분석</div>
      ${locHTML||'<div style="font-size:11px;color:#94a3b8">데이터 없음</div>'}
    </div>`;
}

render();
</script>
</body>
</html>
