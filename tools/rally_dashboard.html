<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>랠리 분석 대시보드</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f1f5f9;padding:16px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;font-weight:900;color:#0f172a;margin-bottom:4px}
  .sub{font-size:12px;color:#64748b;margin-bottom:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .ct{font-size:13px;font-weight:900;color:#334155;margin-bottom:12px;display:flex;align-items:center;gap:6px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
  .kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
  .kl{font-size:9px;font-weight:800;color:#64748b;margin-bottom:4px}
  .kvs{display:flex;align-items:baseline;justify-content:center;gap:4px}
  .kv1{font-size:16px;font-weight:900;color:#0891b2}
  .karr{font-size:10px;color:#94a3b8}
  .kv2{font-size:16px;font-weight:900;color:#ea580c}

  .chart{width:100%;height:200px;position:relative;margin-top:8px}
  .legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;font-size:10px;font-weight:700;color:#475569}
  .lg{display:flex;align-items:center;gap:4px}
  .lgd{width:12px;height:12px;border-radius:3px}

  .tiles{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
  .tile{width:26px;border-radius:4px;overflow:hidden;text-align:center;padding-bottom:2px}
  .tset{height:3px}
  .tsec{font-size:9px;font-weight:900;padding-top:2px}
  .tscore{font-size:6px;font-weight:800;color:#334155;background:rgba(0,0,0,.06);border-radius:2px;margin:1px 1px 0}

  .gp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .gp-rank{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0}
  .gp-seq{flex-shrink:0;display:flex;align-items:center;gap:3px;width:170px}
  .gp-tag{font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px}
  .gp-arrow{font-size:9px;color:#94a3b8;font-weight:900}
  .gp-bar{flex:1;height:14px;background:#f1f5f9;border-radius:4px;overflow:hidden}
  .gp-fill{height:100%;border-radius:4px}
  .gp-pct{flex-shrink:0;width:40px;text-align:right;font-size:12px;font-weight:900}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .mh{font-size:11px;font-weight:900;margin-bottom:8px;padding:4px 8px;border-radius:6px;display:inline-block}
</style>
</head>

3set (30),4051800,11200,Mistake Lose,Smash,Right,
3set (31),4088866,10333,Away Successful Lose,,,
3set (32),4122600,4600,Successful Win,,,8B;1A;4B
3set (33),4196300,5333,Mistake Lose,Hairpin,Right,
3set (34),4213366,8533,Away Successful Lose,,,
3set (35),4238200,17933,Successful Win,,,1A;2B
3set (36),4279566,30933,Mistake Lose,Drop,Right,
3set (37),4347900,7466,Mistake Lose,숏서브 리시브,Right,
3set (38),4370533,18133,Successful Win,,,1A;2B
3set (39),4416466,5866,Successful Win,,,2B;1A;3B
3set (40),4444766,9866,Away Successful Lose,,,
3set (41),4487266,12533,Away Successful Lose,,,
3set (42),4519666,34666,Away Successful Lose,,,`;
const NAME_A="이다희";
const NAME_B="김민선";
const COL_A='#0891b2', COL_B='#ea580c';

const ZONE_GROUP={};
[1,7,2].forEach(z=>ZONE_GROUP[z]='앞');
[5,8,6].forEach(z=>ZONE_GROUP[z]='사이드');
[3,9,4].forEach(z=>ZONE_GROUP[z]='뒤');
const GCOLOR={'앞':{bg:'#dbeafe',tx:'#1d4ed8'},'사이드':{bg:'#fef3c7',tx:'#b45309'},'뒤':{bg:'#fce7f3',tx:'#be185d'}};

function pcsv(t){
  const lines=t.trim().split('\n').filter(Boolean);
  const delim=lines[0].includes(';')?';':',';
  const h=lines[0].split(delim).map(x=>x.trim().replace(/^\uFEFF/,'').replace(/\r/g,''));
  return lines.slice(1).map(s=>{
    const v=s.split(delim).map(x=>x.trim().replace(/\r/g,''));
    const o={};h.forEach((k,i)=>o[k]=v[i]||'');
    const m=o['이름']?.match(/(\d+set)/);if(m)o['set']=m[1];
    if(o.Result==='Away Mistake Win')o.Result='Away Mistakes Win';
    o.sec=parseFloat(o['기간']||0)/1000;
    return o;
  });
}
const W=r=>r.Result?.toLowerCase().includes('win');
const L=r=>r.Result?.toLowerCase().includes('lose');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

function fixPattern(p){
  const s=p.split(';').map(x=>x.trim()).filter(Boolean);
  return s.length===2?[s[1],s[0],s[1]]:s;
}
function groupPatterns(rows){
  const sw=rows.filter(r=>r.Result==='Successful Win'&&r['패턴코트위치']?.trim());
  const c={};
  sw.forEach(r=>{
    const g=fixPattern(r['패턴코트위치'].trim()).map(z=>{
      const m=z.match(/(\d+)([AB])/);return m?ZONE_GROUP[parseInt(m[1])]||'?':'?';
    }).join(' ');
    c[g]=(c[g]||0)+1;
  });
  return {sorted:Object.entries(c).sort((a,b)=>b[1]-a[1]),total:sw.length};
}

// 랠리 시간 흐름 라인차트 (SVG)
function timeChart(rowsA, rowsB){
  const W_=860, H_=200, pad={l:34,r:10,t:12,b:24};
  const maxN=Math.max(rowsA.length, rowsB.length);
  const maxSec=Math.max(...rowsA.map(r=>r.sec), ...rowsB.map(r=>r.sec), 10);
  const xs=n=>pad.l+(n/(maxN-1))*(W_-pad.l-pad.r);
  const ys=s=>H_-pad.b-(s/maxSec)*(H_-pad.t-pad.b);
  function path(rows,col){
    const d=rows.map((r,i)=>`${i===0?'M':'L'}${xs(i).toFixed(1)},${ys(r.sec).toFixed(1)}`).join(' ');
    return`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" opacity="0.85"/>`;
  }
  // 평균선
  const avgA=avg(rowsA.map(r=>r.sec)), avgB=avg(rowsB.map(r=>r.sec));
  let grid='';
  for(let i=0;i<=4;i++){
    const v=maxSec*i/4, y=ys(v);
    grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W_-pad.r}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`;
    grid+=`<text x="${pad.l-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8" font-family="inherit">${Math.round(v)}s</text>`;
  }
  return`<svg viewBox="0 0 ${W_} ${H_}" style="width:100%;height:200px;display:block">
    ${grid}
    <line x1="${pad.l}" y1="${ys(avgA).toFixed(1)}" x2="${W_-pad.r}" y2="${ys(avgA).toFixed(1)}" stroke="${COL_A}" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="${pad.l}" y1="${ys(avgB).toFixed(1)}" x2="${W_-pad.r}" y2="${ys(avgB).toFixed(1)}" stroke="${COL_B}" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    ${path(rowsA,COL_A)}
    ${path(rowsB,COL_B)}
    <text x="${pad.l}" y="${H_-6}" font-size="9" fill="#94a3b8" font-family="inherit">랠리 순서 →</text>
  </svg>`;
}

// 랠리 타일 (시간+스코어)
function tiles(rows){
  const SC={'1set':'#3b82f6','2set':'#7c3aed','3set':'#f59e0b'};
  let h=0,a=0,ps='';
  return rows.map(r=>{
    const sn=r.set||'';
    if(ps&&sn!==ps){h=0;a=0;} ps=sn;
    if(W(r))h++;else if(L(r))a++;
    const bg=W(r)?'#dbeafe':'#fee2e2';
    const tc=W(r)?'#1d4ed8':'#b91c1c';
    return`<div class="tile" style="background:${bg}">
      <div class="tset" style="background:${SC[sn]||'#64748b'}"></div>
      <div class="tsec" style="color:${tc}">${r.sec.toFixed(0)}s</div>
      <div class="tscore">${h}-${a}</div>
    </div>`;
  }).join('');
}

function render(){
  const A=pcsv(CSV_A), B=pcsv(CSV_B);
  const secA=A.map(r=>r.sec), secB=B.map(r=>r.sec);
  const wA=A.filter(W).map(r=>r.sec), lA=A.filter(L).map(r=>r.sec);
  const wB=B.filter(W).map(r=>r.sec), lB=B.filter(L).map(r=>r.sec);

  const kpi=(label,a,b,suf='초')=>`<div class="kpi">
    <div class="kl">${label}</div>
    <div class="kvs"><span class="kv1">${a}${suf}</span><span class="karr">→</span><span class="kv2">${b}${suf}</span></div>
  </div>`;

  const kpis=`<div class="kpis">
    ${kpi('총 랠리', A.length, B.length, '개')}
    ${kpi('평균 랠리', avg(secA).toFixed(1), avg(secB).toFixed(1))}
    ${kpi('득점 랠리', avg(wA).toFixed(1), avg(wB).toFixed(1))}
    ${kpi('실점 랠리', avg(lA).toFixed(1), avg(lB).toFixed(1))}
    ${kpi('최장 랠리', Math.round(Math.max(...secA)), Math.round(Math.max(...secB)))}
  </div>`;

  function patBlock(rows, col){
    const {sorted,total}=groupPatterns(rows);
    const mx=sorted.length?sorted[0][1]:1;
    return sorted.slice(0,5).map(([gp,c],i)=>{
      const pct=Math.round(c/total*100);
      const seq=gp.split(' ').map((g,j)=>{
        const gc=GCOLOR[g]||{bg:'#f1f5f9',tx:'#475569'};
        return`${j>0?'<span class="gp-arrow">→</span>':''}<span class="gp-tag" style="background:${gc.bg};color:${gc.tx}">${g}</span>`;
      }).join('');
      return`<div class="gp-row">
        <div class="gp-rank" style="background:${i===0?col:'#94a3b8'}">${i+1}</div>
        <div class="gp-seq">${seq}</div>
        <div class="gp-bar"><div class="gp-fill" style="width:${Math.round(c/mx*100)}%;background:${col}"></div></div>
        <div class="gp-pct" style="color:${col}">${pct}%</div>
      </div>`;
    }).join('');
  }

  document.getElementById('app').innerHTML=`
    <div class="card">
      <div class="ct">📊 핵심 지표 (vs ${NAME_A} → vs ${NAME_B})</div>
      ${kpis}
    </div>

    <div class="card">
      <div class="ct">📈 랠리 시간 흐름</div>
      ${timeChart(A,B)}
      <div class="legend">
        <div class="lg"><span class="lgd" style="background:${COL_A}"></span>vs ${NAME_A} (평균 ${avg(secA).toFixed(1)}초)</div>
        <div class="lg"><span class="lgd" style="background:${COL_B}"></span>vs ${NAME_B} (평균 ${avg(secB).toFixed(1)}초)</div>
        <div class="lg" style="color:#94a3b8">점선 = 각 경기 평균</div>
      </div>
    </div>

    <div class="card">
      <div class="ct">🎯 득점 루트 (앞·사이드·뒤)</div>
      <div class="two">
        <div>
          <div class="mh" style="background:${COL_A}1a;color:${COL_A}">vs ${NAME_A}</div>
          ${patBlock(A,COL_A)}
        </div>
        <div>
          <div class="mh" style="background:${COL_B}1a;color:${COL_B}">vs ${NAME_B}</div>
          ${patBlock(B,COL_B)}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="ct">🔢 랠리별 시간 · 스코어 — vs ${NAME_A}</div>
      <div class="tiles">${tiles(A)}</div>
    </div>

    <div class="card">
      <div class="ct">🔢 랠리별 시간 · 스코어 — vs ${NAME_B}</div>
      <div class="tiles">${tiles(B)}</div>
      <div class="legend">
        <div class="lg"><span class="lgd" style="background:#dbeafe;border:1px solid #1d4ed8"></span>득점</div>
        <div class="lg"><span class="lgd" style="background:#fee2e2;border:1px solid #b91c1c"></span>실점</div>
        <div class="lg"><span class="lgd" style="background:#3b82f6"></span>1set</div>
        <div class="lg"><span class="lgd" style="background:#7c3aed"></span>2set</div>
        <div class="lg"><span class="lgd" style="background:#f59e0b"></span>3set</div>
      </div>
    </div>`;
}
render();
</script>
</body>
