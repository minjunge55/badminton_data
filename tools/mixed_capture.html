function pcsv(t){
  // 구분자 자동 감지 (세미콜론 or 콤마)
  const lines=t.trim().split('\n').filter(Boolean);
  if(lines.length<2)return[];
  const delim=lines[0].includes(';')?';':',';
  const h=lines[0].split(delim).map(x=>x.trim().replace(/^\uFEFF/,'').replace(/\r/g,''));
  return lines.slice(1).map(s=>{
    const v=s.split(delim).map(x=>x.trim().replace(/\r/g,''));
    const o={};h.forEach((k,i)=>o[k]=v[i]||'');

    // 신규 포맷 → 기존 포맷으로 정규화
    // 이름: "1set (1)" → "1set"
    if(o['이름']){const m=o['이름'].match(/(\d+set)/);if(m)o['이름']=m[1];}
    // Player 컬럼: "Home player" → "Player"
    if(o['Home player']!==undefined){o['Player']=o['Home player'];delete o['Home player'];}
    // 실수기술: "Technics" → "실수 기술"
    if(o['Technics']!==undefined){o['실수 기술']=o['Technics'];delete o['Technics'];}
    // 득점유형: "득점상황" → "득점유형"
    if(o['득점상황']!==undefined){
      const map={'공격상황':'공격','드라이브상황':'중간볼','초구상황':'초구','수비전환상황':'수비'};
      o['득점유형']=map[o['득점상황']]||o['득점상황'];
    }
    // 실점유형: "실점상황" → "상대성공실점"
    if(o['실점상황']!==undefined){
      const map={'수비상황':'수비','드라이브상황':'중간볼','초구상황':'초구'};
      o['상대성공실점']=map[o['실점상황']]||o['실점상황'];
    }
    // Result 정규화: "Away Mistake Win" → "Away Mistakes Win"
    if(o['Result']==='Away Mistake Win')o['Result']='Away Mistakes Win';
    // 실수기술 영→한 매핑 (ETC 없으면 판단미스 변환 안 함)
    const techMap={
      'Clear':'클리어','Smash':'스매시','Return':'리턴','Drop':'드롭',
      'Hairpin':'헤어핀','Drive':'드라이브','Cut':'커트',
      'Block':'블록(앞잡는것)',
      'Push':'푸시','cross':'크로스','Cross':'크로스',
      'S.Drive':'숏드라이브','Short Drive':'숏드라이브',
      'Serve':'서브','Receive':'리시브','Serve Receive':'서브리시브',
      '숏서브':'숏서브','숏서브 리시브':'숏서브리시브','롱서브 리시브':'롱서브리시브',
      'ETC':'판단미스','etc':'판단미스'
    };
    if(o['실수 기술']&&techMap[o['실수 기술']])o['실수 기술']=techMap[o['실수 기술']];
    return o;
  });
}
const W=r=>r&&r.toLowerCase().includes('win');
const L=r=>r&&r.toLowerCase().includes('lose');
const fmt=ms=>{const s=Math.round(ms/1000);return s<60?s+'초':Math.floor(s/60)+'분'+(s%60)+'초';};
function ckclk(rows){
  const s=[...rows].sort((a,b)=>+a['위치']-+b['위치']);
  let h=0,a=0;const sk=new Set();
  s.forEach((r,i)=>{if(W(r.Result))h++;else if(L(r.Result))a++;if(h>=21||a>=21){if(i+1<s.length)sk.add(i+1);h=0;a=0;}});
  return s.map((r,i)=>{
    if(i===0||sk.has(i)||s[i]['이름']!==s[i-1]['이름'])return{...r,c:null};
    const pe=+s[i-1]['위치']+ +s[i-1]['기간'];const g=(+r['위치']-pe)/1000;
    return{...r,c:(g>0&&g<60)?parseFloat(g.toFixed(1)):null};
  });
}

    if(t) t.className='tab'+(i===n?' on':'');
    if(c) c.style.display=i===n?'flex':'none';
  });
  const hints={1:`📸 ${p1} 득점+실수 스크린샷`,2:`📸 ${p1} 랠리시간 스크린샷`,3:`📸 ${p2} 득점+실수 스크린샷`,4:`📸 ${p2} 랠리시간 스크린샷`};
  document.getElementById('hint').textContent=hints[n]||'';
}

function RA(){
  renderCard('Home1',1,2);
  renderCard('Home2',3,4);
  // 탭 텍스트 초기화
  const p1=document.getElementById('ip1').value, p2=document.getElementById('ip2').value;
  document.getElementById('t1').textContent='📸 '+p1+' 1';
  document.getElementById('t2').textContent='📸 '+p1+' 2';
  document.getElementById('t3').textContent='📸 '+p2+' 1';
  document.getElementById('t4').textContent='📸 '+p2+' 2';
}

function renderCard(key, c1idx, c2idx){
  const p1=document.getElementById('ip1').value, p2=document.getElementById('ip2').value;
  const pn=key==='Home1'?p1:p2;
  const op=document.getElementById('io').value, dt=document.getElementById('id').value;

  const data=GD(), wr=data.filter(r=>r.Result);
  const wins=wr.filter(r=>W(r.Result)).length, loses=wr.filter(r=>L(r.Result)).length;
  const rate=wr.length?Math.round(wins/wr.length*100):0;
  const avg=data.length?data.reduce((s,r)=>s+parseFloat(r['기간']||0),0)/data.length:0;

  const sets=[...new Set(AD.map(r=>r['이름']).filter(Boolean))].sort();
  const ss=sets.map(s=>{const rows=AD.filter(r=>r['이름']===s);return{s,w:rows.filter(r=>W(r.Result)).length,l:rows.filter(r=>L(r.Result)).length};});
  const badgeHTML=ss.map(x=>{const win=x.w>x.l;return`<div class="bg" style="background:${win?'#eff6ff':'#fef2f2'};border:1px solid ${win?'#bfdbfe':'#fecaca'};color:${win?'#1d4ed8':'#b91c1c'}">${x.s} ${x.w}-${x.l}</div>`;}).join('');
  const kpiHTML=[{l:'팀 득점',v:wins,c:'#1d4ed8',bg:'#eff6ff'},{l:'팀 실점',v:loses,c:'#b91c1c',bg:'#fef2f2'},{l:'득점률',v:rate+'%',c:'#1e3a5f',bg:'#eff6ff'},{l:'본인 실수',v:data.filter(r=>r['실수 기술']&&r['Player']===key).length,c:'#1d4ed8',bg:'#eff6ff'}].map(k=>`<div class="kc" style="background:${k.bg}"><div class="kl" style="color:${k.c}">${k.l}</div><div class="kv" style="color:${k.c}">${k.v}</div></div>`).join('');

  [c1idx, c2idx].forEach(idx=>{
    document.getElementById('dp'+idx).textContent=pn;
    document.getElementById('di'+idx).textContent='vs '+op+' · '+dt;
    document.getElementById('ds'+idx).innerHTML=badgeHTML;
    document.getElementById('dk'+idx).innerHTML=idx===c1idx?kpiHTML:'';
  });

  const scM={},lcM={};
  data.forEach(r=>{const t=r['득점유형'];if(t)scM[t]=(scM[t]||0)+1;});
  data.forEach(r=>{const t=r['상대성공실점'];if(t)lcM[t]=(lcM[t]||0)+1;});
  const tSc=SC_C.reduce((s,k)=>s+(scM[k]||0),0), tLc=LC_C.reduce((s,k)=>s+(lcM[k]||0),0);

  const myM=data.filter(r=>r['실수 기술']&&r['Player']===key);
  const myT=myM.length;
  const tm={};myM.forEach(r=>{const t=r['실수 기술'];tm[t]=(tm[t]||0)+1;});
  const te=Object.entries(tm).sort((a,b)=>b[1]-a[1]), tmx=te[0]?.[1]||1;

  const rm={};wr.forEach(r=>{rm[r.Result]=(rm[r.Result]||0)+1;});
  const re=Object.entries(rm).sort((a,b)=>b[1]-a[1]), rmx=re[0]?.[1]||1;

  let sh=0,sa=0,ps='';
  const ckR=data.map(r=>{const cs=r['이름']||'';if(ps&&cs!==ps){sh=0;sa=0;}ps=cs;if(W(r.Result))sh++;else if(L(r.Result))sa++;return{...r,sh,sa};}).filter(r=>r.c!==null&&r.c>0);
  const ca=ckR.length?ckR.reduce((s,r)=>s+r.c,0)/ckR.length:0, co=ckR.filter(r=>r.c>25).length;

  // ── 카드A: 득점유형 + 실점유형 + 본인실수기술 ──────────────────
  let hA='';
  hA+=`<div><div style="font-size:8px;font-weight:900;color:#1d4ed8;margin-bottom:4px;display:flex;align-items:center;gap:5px"><span style="width:2px;height:13px;background:#1d4ed8;border-radius:2px;display:inline-block"></span>득점 유형 <span style="font-weight:400;color:#94a3b8;font-size:7px">총 ${tSc}회</span></div><div class="g4">`;
  SC_C.forEach((cat,i)=>{const cnt=scM[cat]||0,pct=tSc>0?Math.round(cnt/tSc*100):0,c=BLUE[i];hA+=`<div class="cat" style="background:#fff;border:1px solid ${c}20;border-left-color:${c}"><div class="cl">${cat}</div><div class="cv" style="color:${c}">${cnt}<span style="font-size:8px;color:#94a3b8;font-weight:400">회</span></div><div class="ct" style="background:#f1f5f9"><div style="width:${pct}%;height:100%;background:${c};border-radius:2px"></div></div><div class="cp" style="color:${c}">${pct}%</div></div>`;});
  hA+=`</div></div>`;
  hA+=`<div><div style="font-size:8px;font-weight:900;color:#b91c1c;margin-bottom:4px;display:flex;align-items:center;gap:5px"><span style="width:2px;height:13px;background:#b91c1c;border-radius:2px;display:inline-block"></span>실점 유형 <span style="font-weight:400;color:#94a3b8;font-size:7px">총 ${tLc}회</span></div><div class="g4">`;
  LC_C.forEach((cat,i)=>{const cnt=lcM[cat]||0,pct=tLc>0?Math.round(cnt/tLc*100):0,c=RED[Math.min(i,2)];hA+=`<div class="cat" style="background:#fff;border:1px solid ${c}20;border-left-color:${c}"><div class="cl">${cat}</div><div class="cv" style="color:${c}">${cnt}<span style="font-size:8px;color:#94a3b8;font-weight:400">회</span></div><div class="ct" style="background:#f1f5f9"><div style="width:${pct}%;height:100%;background:${c};border-radius:2px"></div></div><div class="cp" style="color:${c}">${pct}%</div></div>`;});
  hA+=`</div></div>`;
  hA+=`<div class="s" style="background:#eff6ff;border:1px solid #bfdbfe"><div class="stl" style="color:#1d4ed8">본인 실수 기술 — 총 ${myT}회</div>`;
  if(te.length===0)hA+=`<div style="color:#94a3b8;font-size:10px;text-align:center;padding:6px 0">기록 없음</div>`;
  else te.forEach(([t,c],i)=>{const pct=Math.round(c/myT*100),col=RED[Math.min(i,RED.length-1)];hA+=`<div class="br"><div class="bh"><span class="bn">${t}</span><div class="bm"><span class="bp">${pct}%</span><span class="bc" style="color:${col}">${c}회</span></div></div><div class="bt"><div class="bf" style="width:${c/tmx*100}%;background:${col}"></div></div></div>`;});
  hA+=`</div>`;
  hA+=`<div class="s" style="background:#f8fafc;border:1px solid #e2e8f0"><div class="stl" style="color:#334155">경기 결과</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px">`;
  re.forEach(([k,v])=>{const m=RM[k];hA+=`<div class="rr"><div class="rd" style="background:${m?.c}"></div><span class="rl">${m?.l||k}</span><span class="rc" style="color:${m?.c}">${v}</span><div class="rt" style="width:40px"><div class="rf" style="width:${v/rmx*100}%;background:${m?.c}"></div></div></div>`;});
  hA+=`</div></div>`;
  const matchWin = wins > loses;
  if(!matchWin) hA+=`<div style="text-align:center;padding:12px 0 4px;font-size:15px;font-weight:900;color:#b91c1c;letter-spacing:1px">고생했어요! 💪</div>`;
  document.getElementById('db'+c1idx).innerHTML=hA;
  const RBG=res=>W(res)?'#dbeafe':L(res)?'#fee2e2':'#f1f5f9';
  const RTC=res=>W(res)?'#1d4ed8':L(res)?'#b91c1c':'#64748b';

  const rallyData=(()=>{
    let sh=0,sa=0,ps='';
    return data.map(r=>{
      const sn=r['이름']||'';
      if(ps&&sn!==ps){sh=0;sa=0;}
      ps=sn;
      const sec=parseFloat(r['기간']||0)/1000;
      if(W(r.Result))sh++;else if(L(r.Result))sa++;
      return{sec,sn,sh,sa,res:r.Result};
    }).filter(r=>r.sec>0);
  })();
  const winD=rallyData.filter(r=>W(r.res));
  const loseD=rallyData.filter(r=>L(r.res));
  const wAvg=winD.length?winD.reduce((s,r)=>s+r.sec,0)/winD.length:0;
  const lAvg=loseD.length?loseD.reduce((s,r)=>s+r.sec,0)/loseD.length:0;
  const tAvg=rallyData.length?rallyData.reduce((s,r)=>s+r.sec,0)/rallyData.length:0;

  const rTileHTML=rallyData.map(r=>{
    const v=r.sec,sn=r.sn,sc=SETC[sn]||'#64748b';
    return`<div style="width:28px;border-radius:4px;overflow:hidden;background:${RBG(r.res)};border:1px solid #e2e8f0"><div style="height:3px;background:${sc}"></div><div style="padding:2px 1px 3px;text-align:center"><div style="font-size:10px;font-weight:900;color:${RTC(r.res)};line-height:1">${v.toFixed(0)}s</div><div style="font-size:6px;font-weight:800;color:#334155;margin-top:1px;background:rgba(255,255,255,0.85);border-radius:2px;padding:0 1px">${r.sh}-${r.sa}</div><div style="font-size:5px;font-weight:800;color:${sc};margin-top:1px">${sn}</div></div></div>`;
  }).join('');

  const rLegHTML=`<div style="display:flex;gap:9px;margin-top:8px;flex-wrap:wrap;font-size:9px">${[['#1d4ed8','#dbeafe','득점'],['#b91c1c','#fee2e2','실점']].map(([c,bg,l])=>`<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:10px;background:${bg};border:1px solid ${c};border-radius:2px;display:inline-block"></span><span style="color:#475569;font-weight:700">${l}</span></span>`).join('')}${Object.entries(SETC).map(([s,c])=>`<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:4px;background:${c};border-radius:2px;display:inline-block"></span><span style="color:#475569;font-weight:700">${s}</span></span>`).join('')}</div>`;

  const rSumHTML=`<div style="display:flex;gap:5px;margin-bottom:9px">${[{l:'전체 평균',v:tAvg.toFixed(1)+'초',c:'#334155',bg:'#f1f5f9'},{l:'득점 평균',v:wAvg.toFixed(1)+'초',c:'#1d4ed8',bg:'#dbeafe'},{l:'실점 평균',v:lAvg.toFixed(1)+'초',c:'#b91c1c',bg:'#fee2e2'}].map(k=>`<div style="flex:1;background:${k.bg};border:1px solid ${k.c}30;border-radius:9px;padding:8px 4px;text-align:center"><div style="font-size:7px;color:#64748b;font-weight:800;margin-bottom:3px">${k.l}</div><div style="font-size:16px;font-weight:900;color:${k.c};line-height:1">${k.v}</div></div>`).join('')}</div>`;

  let hB=`<div class="s" style="background:#f8fafc;border:1px solid #e2e8f0;overflow:visible"><div class="stl" style="color:#334155">🏸 랠리 시간</div>${rSumHTML}<div style="font-size:10px;color:#475569;font-weight:800;margin-bottom:6px">랠리별 · 세트</div><div style="display:flex;flex-wrap:wrap;gap:2px">${rTileHTML}</div>${rLegHTML}</div>`;
  document.getElementById('db'+c2idx).innerHTML=hB;
}

AD=ckclk(pcsv(CSV));BS();RA();
</script>
</body>
</html>
