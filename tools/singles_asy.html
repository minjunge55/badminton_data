function pcsv(t){const l=t.trim().split('\n').filter(Boolean);if(l.length<2)return[];const h=l[0].split(';').map(x=>x.trim());const techMap={'Clear':'클리어','Smash':'스매시','Return':'리턴','Drop':'드롭','Hairpin':'헤어핀','Drive':'드라이브','Cut':'커트','Block':'블록(앞잡는것)','Push':'푸시','cross':'크로스','Cross':'크로스','S.Drive':'숏드라이브','Short Drive':'숏드라이브','Serve':'서브','Receive':'리시브','Serve Receive':'서브리시브','ETC':'판단미스','etc':'판단미스'};return l.slice(1).map(s=>{const v=s.split(';').map(x=>x.trim());const o={};h.forEach((k,i)=>o[k]=v[i]||'');if(o['실수 기술']&&techMap[o['실수 기술']])o['실수 기술']=techMap[o['실수 기술']];return o;});}
const W=r=>r&&r.toLowerCase().includes('win');
const L=r=>r&&r.toLowerCase().includes('lose');
const fmt=ms=>{const s=Math.round(ms/1000);return s<60?s+'초':Math.floor(s/60)+'분'+(s%60)+'초';};
function ckclk(rows){
  const s=[...rows].sort((a,b)=>+a['위치']-+b['위치']);
  let h=0,a=0;const sk=new Set();
  s.forEach((r,i)=>{if(W(r.Result))h++;else if(L(r.Result))a++;if(h>=21||a>=21){if(i+1<s.length)sk.add(i+1);h=0;a=0;}});
  return s.map((r,i)=>{
    if(i===0||sk.has(i)||s[i]['이름']!==s[i-1]['이름'])return{...r,c:null};
    const pe=+s[i-1]['위치']+ +s[i-1]['기간'];const g=(+r['위치']-pe)/1000;
    return{...r,c:(g>0&&g<60)?parseFloat(g.toFixed(1)):null};
  });
}

function FULL_COURT(loseZ, winZ) {
  // 텍스트 존명 기반 바 차트 (안세영 커스텀)
  const wTotal = Object.values(winZ).reduce((a,b)=>a+b,0);
  const lTotal = Object.values(loseZ).reduce((a,b)=>a+b,0);
  const wMax = Math.max(...Object.values(winZ),1);
  const lMax = Math.max(...Object.values(loseZ),1);

  function bars(zMap, total, mx, color, emptyColor) {
    return Object.entries(zMap)
      .sort((a,b)=>b[1]-a[1])
      .map(([zone,cnt])=>{
        const pct = total>0 ? Math.round(cnt/total*100) : 0;
        const w = Math.round(cnt/mx*100);
        return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
          <div style="width:72px;font-size:10px;font-weight:800;color:#1e293b;text-align:right;flex-shrink:0">${zone}</div>
          <div style="flex:1;background:#f1f5f9;border-radius:3px;height:16px;overflow:hidden">
            <div style="width:${w}%;height:100%;background:${color};border-radius:3px"></div>
          </div>
          <div style="width:28px;font-size:11px;font-weight:900;color:${color};text-align:right;flex-shrink:0">${cnt}회</div>
          <div style="width:30px;font-size:9px;color:#64748b;text-align:right;flex-shrink:0">${pct}%</div>
        </div>`;
      }).join('');
  }

  const W=370, H=10; // dummy
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 10px">
      <div style="font-size:9px;font-weight:900;color:#1d4ed8;letter-spacing:.5px;margin-bottom:8px">득점 존 (상대 코트)</div>
      ${bars(winZ, wTotal, wMax, '#1d4ed8', '#dbeafe')}
      ${wTotal===0?'<div style="font-size:10px;color:#94a3b8;text-align:center">데이터 없음</div>':''}
    </div>
    <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:9px 10px">
      <div style="font-size:9px;font-weight:900;color:#b91c1c;letter-spacing:.5px;margin-bottom:8px">실점 존 (본인 코트)</div>
      ${bars(loseZ, lTotal, lMax, '#b91c1c', '#fee2e2')}
      ${lTotal===0?'<div style="font-size:10px;color:#94a3b8;text-align:center">데이터 없음</div>':''}
    </div>
  </div>`;
}

function LC(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{AD=ckclk(pcsv(e.target.result));BS();R();};r.readAsText(f,'utf-8');}
function BS(){

  ['all',...sets].forEach(s=>{const b=document.createElement('button');b.className='epb'+(s===CF?' on':'');b.textContent=s==='all'?'전체':s;b.onclick=()=>{CF=s;BS();R();};w.appendChild(b);});
}
const GD=()=>CF==='all'?AD:AD.filter(r=>r['이름']===CF);

function SW(n){
  curTab=n;
  [1,2,3].forEach(i=>{
    const t=document.getElementById('t'+i), c=document.getElementById('card'+i);
    if(t) t.className='tab'+(i===n?' on':'');
    if(c) c.style.display=i===n?'flex':'none';
  });
  const hints={1:'📸 코트+실수 화면 스크린샷',2:'📸 25초 클락 스크린샷',3:'📸 25초 클락 이어서 스크린샷'};

}

function R(){
  const pn=document.getElementById('ip').value,op=document.getElementById('io').value,dt=document.getElementById('id').value;

  // 카드1,2,3 공통 헤더 업데이트
  ['dp','dp2','dp3'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=pn;});
  ['di','di2','di3'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='vs '+op+' · '+dt;});

  const data=GD(),wr=data.filter(r=>r.Result);
  const wins=wr.filter(r=>W(r.Result)).length,loses=wr.filter(r=>L(r.Result)).length;
  const rate=wr.length?Math.round(wins/wr.length*100):0;
  const avg=data.length?data.reduce((s,r)=>s+parseFloat(r['기간']||0),0)/data.length:0;

  const sets=[...new Set(AD.map(r=>r['이름']).filter(Boolean))].sort();
  const ss=sets.map(s=>{const rows=AD.filter(r=>r['이름']===s);return{s,w:rows.filter(r=>W(r.Result)).length,l:rows.filter(r=>L(r.Result)).length};});
  const badgeHTML=ss.map(x=>{const win=x.w>x.l;return`<div class="bg" style="background:${win?'#eff6ff':'#fef2f2'};border:1px solid ${win?'#bfdbfe':'#fecaca'};color:${win?'#1d4ed8':'#b91c1c'}">${x.s}</div>`;}).join('');
  ['ds','ds2','ds3'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=badgeHTML;});

  const kpiHTML=[{l:'득점',v:wins,c:'#1d4ed8',bg:'#eff6ff'},{l:'실점',v:loses,c:'#b91c1c',bg:'#fef2f2'},{l:'득점률',v:rate+'%',c:'#1e3a5f',bg:'#eff6ff'},{l:'평균랠리',v:fmt(avg),c:'#334155',bg:'#f8fafc'}].map(k=>`<div class="kc" style="background:${k.bg}"><div class="kl" style="color:${k.c}">${k.l}</div><div class="kv" style="color:${k.c}">${k.v}</div></div>`).join('');
  ['dk','dk2','dk3'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=kpiHTML;});

  const wz={},lz={};
  data.forEach(r=>{const z=pz(r['Zone']);if(!z)return;if(W(r.Result))wz[z]=(wz[z]||0)+1;if(L(r.Result))lz[z]=(lz[z]||0)+1;});
  const tm={};data.filter(r=>r['실수 기술']).forEach(r=>{const t=r['실수 기술'];tm[t]=(tm[t]||0)+1;});
  const te=Object.entries(tm).sort((a,b)=>b[1]-a[1]),tt=te.reduce((s,[,v])=>s+v,0),tmx=te[0]?.[1]||1;
  const rm={};wr.forEach(r=>{rm[r.Result]=(rm[r.Result]||0)+1;});
  const re=Object.entries(rm).sort((a,b)=>b[1]-a[1]),rmx=re[0]?.[1]||1;
  let sh=0,sa=0,ps='';
  const ckR=data.map(r=>{const cs=r['이름']||'';if(ps&&cs!==ps){sh=0;sa=0;}ps=cs;if(W(r.Result))sh++;else if(L(r.Result))sa++;return{...r,sh,sa};}).filter(r=>r.c!==null&&r.c>0);
  const ca=ckR.length?ckR.reduce((s,r)=>s+r.c,0)/ckR.length:0,co=ckR.filter(r=>r.c>25).length;

  // ── 카드1: 코트맵 + 실수기술 + 결과 ───────────────────────────
  let h1=`
  ${FULL_COURT(lz,wz)}
  <div class="g2">
    <div class="s" style="background:#fef2f2;border:1px solid #fecaca;padding:7px 9px">
      <div class="stl" style="color:#b91c1c">실수 기술 · ${tt}회</div>
      ${te.map(([t,c],i)=>{
        const pct=Math.round(c/tt*100),col=R2[Math.min(i,R2.length-1)];
        return `<div class="br"><div class="bh"><span class="bn">${t}</span><div class="bm"><span class="bp">${pct}%</span><span class="bc" style="color:${col}">${c}</span></div></div><div class="bt"><div class="bf" style="width:${c/tmx*100}%;background:${col}"></div></div></div>`;
      }).join('')}
    </div>
    <div class="s" style="background:#f8fafc;border:1px solid #e2e8f0;padding:7px 9px">
      <div class="stl" style="color:#334155">경기 결과</div>
      ${re.map(([k,v])=>{
        const m=RM[k];
        return `<div class="rr"><div class="rd" style="background:${m?.c}"></div><span class="rl">${m?.l||k}</span><span class="rc" style="color:${m?.c}">${v}</span><div class="rt"><div class="rf" style="width:${v/rmx*100}%;background:${m?.c}"></div></div></div>`;
      }).join('')}
    </div>
  </div>`;
  document.getElementById('db1').innerHTML=h1;

  // ── 카드2: 랠리 시간 (득점/실점 색상) ────────────────────────
  const RBG=res=>W(res)?'#dbeafe':L(res)?'#fee2e2':'#f1f5f9';
  const RTC=res=>W(res)?'#1d4ed8':L(res)?'#b91c1c':'#64748b';

  const rallyData=(()=>{
    let sh=0,sa=0,ps='';
    return GD().map(r=>{
      const sn=r['이름']||'';
      if(ps&&sn!==ps){sh=0;sa=0;}
      ps=sn;
      const sec=parseFloat(r['기간']||0)/1000;
      if(W(r.Result))sh++;else if(L(r.Result))sa++;
      return{sec,sn,sh,sa,res:r.Result};
    }).filter(r=>r.sec>0);
  })();

  const winData  = rallyData.filter(r=>W(r.res));
  const loseData = rallyData.filter(r=>L(r.res));
  const wAvg = winData.length  ? winData.reduce((s,r)=>s+r.sec,0)/winData.length   : 0;
  const lAvg = loseData.length ? loseData.reduce((s,r)=>s+r.sec,0)/loseData.length : 0;
  const tAvg = rallyData.length ? rallyData.reduce((s,r)=>s+r.sec,0)/rallyData.length : 0;

  const rTileHTML=rallyData.map(r=>{
    const v=r.sec,sn=r.sn,sc=SC[sn]||'#64748b';
    return`<div style="width:28px;border-radius:4px;overflow:hidden;background:${RBG(r.res)};border:1px solid #e2e8f0"><div style="height:3px;background:${sc}"></div><div style="padding:2px 1px 3px;text-align:center"><div style="font-size:10px;font-weight:900;color:${RTC(r.res)};line-height:1">${v.toFixed(0)}s</div><div style="font-size:6px;font-weight:800;color:#334155;margin-top:1px;background:rgba(255,255,255,0.85);border-radius:2px;padding:0 1px">${r.sh}-${r.sa}</div><div style="font-size:5px;font-weight:800;color:${sc};margin-top:1px">${sn}</div></div></div>`;
  }).join('');

  document.getElementById('t3').style.display='none';

  let h2=`<div class="s" style="background:#f8fafc;border:1px solid #e2e8f0;overflow:visible">
    <div class="stl" style="color:#334155">🏸 랠리 시간</div>
    <div style="display:flex;gap:5px;margin-bottom:9px">
      ${[{l:'전체 평균',v:tAvg.toFixed(1)+'초',c:'#334155',bg:'#f1f5f9'},
         {l:'득점 평균',v:wAvg.toFixed(1)+'초',c:'#1d4ed8',bg:'#dbeafe'},
         {l:'실점 평균',v:lAvg.toFixed(1)+'초',c:'#b91c1c',bg:'#fee2e2'}
      ].map(k=>`<div style="flex:1;background:${k.bg};border:1px solid ${k.c}30;border-radius:9px;padding:8px 4px;text-align:center"><div style="font-size:8px;color:#64748b;font-weight:800;margin-bottom:3px">${k.l}</div><div style="font-size:19px;font-weight:900;color:${k.c};line-height:1">${k.v}</div></div>`).join('')}
    </div>
    <div style="font-size:10px;color:#475569;font-weight:800;margin-bottom:6px">랠리별 · 세트 · 점수</div>
    <div style="display:flex;flex-wrap:wrap;gap:2px">${rTileHTML}</div>
    <div style="display:flex;gap:10px;margin-top:9px;flex-wrap:wrap;font-size:9px">
      ${[['#1d4ed8','#dbeafe','득점'],['#b91c1c','#fee2e2','실점']].map(([c,bg,l])=>`
        <span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:10px;background:${bg};border:1px solid ${c};border-radius:2px;display:inline-block"></span><span style="color:#475569;font-weight:700">${l}</span></span>`).join('')}
      ${Object.entries(SC).map(([s,c])=>`
        <span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:4px;background:${c};border-radius:2px;display:inline-block"></span><span style="color:#475569;font-weight:700">${s}</span></span>`).join('')}
    </div>
  </div>`;
  document.getElementById('db2').innerHTML=h2;
}
AD=ckclk(pcsv(CSV));BS();R();
</script>
</body>
</html>
